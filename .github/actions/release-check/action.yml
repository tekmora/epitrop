# release-binaries.yml and release-dry-run.yml both run these steps, so the dry
# run checks the configuration with the tool versions the release uses.
name: Release Check
description: Install Syft and check the GoReleaser configuration

runs:
  using: composite
  steps:
    - name: Install Syft
      uses: anchore/sbom-action/download-syft@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c  # v0.24.3
      with:
        syft-version: v1.54.1

    - name: Check GoReleaser Configuration
      uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
      with:
        distribution: goreleaser
        version: v2.19.0
        args: check
