name: Setup Go Toolchain
description: Set up the Go version that go.mod names, with the module cache on or off

inputs:
  cache:
    description: Whether setup-go restores and saves the module cache
    required: false
    default: 'true'

runs:
  using: composite
  steps:
    - name: Setup Go Toolchain
      uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
      with:
        go-version-file: 'go.mod'
        cache: ${{ inputs.cache }}
