name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

env:
  # The Praetor engine this repository runs: the Git hooks install exactly this commit, and
  # tools/go/go.mod pins the same commit for the gates below. Move both together, with a
  # re-adopt (praetorctl adopt).
  PRAETOR_REF: 18c50fc7476aeb92011a409bc6b71351a9ded3cf

jobs:
  # The required check. Every gate here runs offline; the tools come from
  # tools/go/go.mod at pinned versions that Renovate moves.
  go:
    # The sandbox tests need passt with --map-host-loopback, which Ubuntu 24.04's passt
    # (2024_02_20) lacks, and an env with --ignore-signal and --default-signal.
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          # The documentation drift check compares the base and head commits.
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e  # v7.0.0
        with:
          go-version-file: 'go.mod'
      - name: Commit messages and the pull request text name no model or coding tool as an author
        # On a pull request: the commits it adds and its text. On a push: the commits the push
        # brought, so the text a squash merge was given is read as well.
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            git log -z --format='%H%n%B' "$PR_BASE..$PR_HEAD" > "$RUNNER_TEMP/commit-messages"
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-text.txt"
            go run ./tools/commitmsg -messages="$RUNNER_TEMP/commit-messages" -text="$RUNNER_TEMP/pr-text.txt"
          else
            git log -z --format='%H%n%B' "$PUSH_BEFORE..$PUSH_HEAD" > "$RUNNER_TEMP/commit-messages"
            go run ./tools/commitmsg -messages="$RUNNER_TEMP/commit-messages"
          fi
      - name: Sandbox runner dependencies
        # Ubuntu restricts unprivileged user namespaces, which bwrap needs, through AppArmor.
        run: |
          sudo apt-get update
          sudo apt-get install -y bubblewrap passt
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
      - name: gofmt
        run: |
          unformatted="$(gofmt -l .)"
          if [ -n "$unformatted" ]; then
            echo "::error::gofmt would reformat these files:"
            echo "$unformatted"
            exit 1
          fi
      - run: go vet ./...
      # The supervisor runs on Linux only. Its tests still have to compile elsewhere, or
      # nobody on another platform can vet or test the repository at all.
      - name: go vet for macOS and Windows
        run: |
          GOOS=darwin go vet ./...
          GOOS=windows go vet ./...
      # A module update that leaves stale lines in go.sum passes every other step.
      - name: go.mod and go.sum are tidy
        run: go mod tidy -diff
      # One run, verbose: a skipped test shows with its reason, and the scope probe logs the
      # runner's systemd version and how long a job took to enter its scope. A sandbox test
      # that finds no systemd user scope here fails; it skips only outside CI.
      - run: go test -race -v ./...
      # go test runs no benchmark. One pass of each keeps them building and running; a pass
      # fails only on an error, such as a queued event log writer that hit its lock timeout.
      - name: Benchmarks, one pass each
        run: go test -run '^$' -bench . -benchtime=1x ./...
      # tools/schemas builds only with the schemasrefresh tag, so ./... above sees a
      # placeholder with no tests: its extractor tests would run nowhere.
      - name: go vet and go test for tools/schemas (tag schemasrefresh)
        run: |
          go vet -tags schemasrefresh ./tools/schemas/
          go test -race -v -tags schemasrefresh ./tools/schemas/
      - name: golangci-lint
        run: go tool -modfile=tools/go/go.mod golangci-lint run ./...
      # HISS-12: no credential anywhere in Git history, not only in the tree (the checkout
      # above fetches all of it). gitleaks has a tool module of its own because its
      # dependencies conflict with golangci-lint's in tools/go.
      - name: gitleaks (full history)
        run: go tool -modfile=tools/gitleaks/go.mod gitleaks git --no-banner --redact .
      - name: HISS scan (praetorctl audit)
        run: go tool -modfile=tools/go/go.mod standardsctl audit --offline
      # govulncheck runs through praetorctl so security/vex/go.openvex.json is
      # honoured, the same verdict the pre-push gate reaches.
      - name: govulncheck (VEX-aware)
        run: >-
          go tool -modfile=tools/go/go.mod standardsctl security govuln --path=.
          -- go tool -modfile=tools/go/go.mod govulncheck
      - name: gosec
        run: go tool -modfile=tools/go/go.mod gosec -conf .gosec.json ./...
      # semgrep, declared by the framework profile and the agent:sandboxed facet, with the
      # repository's own HISS rules (.config/semgrep/hiss.yml). The self-test plants one finding
      # per rule and must see each reported before the tree scan is trusted. Every package,
      # semgrep's dependencies included, is pinned with its hashes.
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97  # v7.0.0
        with:
          python-version: '3.14'
      - name: Install semgrep
        run: |
          python -m venv "$RUNNER_TEMP/semgrep"
          "$RUNNER_TEMP/semgrep/bin/pip" install --require-hashes --no-deps -r tools/semgrep/requirements.txt
          echo "$RUNNER_TEMP/semgrep/bin" >> "$GITHUB_PATH"
      - name: semgrep self-test (planted findings must fail)
        run: bash tools/linterselftest/selftest.sh semgrep
      - name: semgrep scan
        run: semgrep scan --config .config/semgrep/hiss.yml --error --metrics=off --disable-version-check .
      # spectral, declared by the api:public-contract facet, lints the OpenAPI snapshots under
      # internal/sources/*/testdata/upstream with .spectral.yaml; warnings fail too. The CLI is
      # locked in tools/spectral; the self-test plants a document without info and with a
      # dangling reference and must see both reported.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1  # v7.1.0
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: tools/spectral/package-lock.json
      - name: Install spectral
        run: npm ci --ignore-scripts --no-audit --no-fund --prefix tools/spectral
      - name: spectral self-test (planted findings must fail)
        run: bash tools/linterselftest/selftest.sh spectral
      - name: spectral lint
        run: >-
          tools/spectral/node_modules/.bin/spectral lint -F warn --ruleset .spectral.yaml
          'internal/sources/*/testdata/upstream/*-openapi.yaml'
      # trivy, declared by the framework profile: misconfiguration and secret scans of the tree.
      # The release tarball is pinned by its sha256 from the upstream checksums file; the
      # self-test plants a HIGH Dockerfile finding and a CRITICAL token and must see both.
      # Dependency vulnerabilities stay with govulncheck above.
      - name: Install trivy
        env:
          TRIVY_VERSION: 0.75.0
          TRIVY_SHA256: c6e65abddb348e25f10549df887045629cf28cc72453cd1c63acb717316b3f3f
        run: |
          mkdir -p "$RUNNER_TEMP/trivy"
          curl -fsSL --max-time 120 -o "$RUNNER_TEMP/trivy.tar.gz" \
            "https://github.com/aquasecurity/trivy/releases/download/v${TRIVY_VERSION}/trivy_${TRIVY_VERSION}_Linux-64bit.tar.gz"
          echo "${TRIVY_SHA256}  $RUNNER_TEMP/trivy.tar.gz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/trivy.tar.gz" -C "$RUNNER_TEMP/trivy" trivy
          echo "$RUNNER_TEMP/trivy" >> "$GITHUB_PATH"
      - name: trivy self-test (planted findings must fail)
        run: bash tools/linterselftest/selftest.sh trivy
      - name: trivy scan
        run: >-
          trivy fs --scanners misconfig,secret --exit-code 1 --severity HIGH,CRITICAL
          --skip-version-check --disable-telemetry .
      - name: Documentation drift
        env:
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE: ${{ github.event.pull_request.base.sha }}
          PR_HEAD: ${{ github.event.pull_request.head.sha }}
          PR_BODY: ${{ github.event.pull_request.body }}
          PUSH_BEFORE: ${{ github.event.before }}
          PUSH_HEAD: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "pull_request" ]; then
            printf '%s\n' "$PR_BODY" > "$RUNNER_TEMP/pr-body.txt"
            go tool -modfile=tools/go/go.mod standardsctl docs references --path=. \
              --base="$PR_BASE" --head="$PR_HEAD" --pr-body-file="$RUNNER_TEMP/pr-body.txt"
          else
            go tool -modfile=tools/go/go.mod standardsctl docs references --path=. \
              --base="$PUSH_BEFORE" --head="$PUSH_HEAD"
          fi
