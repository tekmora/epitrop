name: Live catalog sync

# Runs epitropctl sync against real Ollama and LiteLLM containers (issue #359) so
# upstream response-shape drift in /api/tags, /api/ps, or /v1/models is caught
# against live servers, not only committed fixtures.
on:
  schedule:
    - cron: '23 5 * * 1'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'catalog/**'
      - 'internal/atomicfile/**'
      - 'internal/sources/ollamalocal/**'
      - 'internal/sources/litellmgateway/**'
      - 'internal/sources/httpfetch/**'
      - 'cmd/epitropctl/sync.go'
      - 'cmd/epitropctl/cli_build_test.go'
      - 'cmd/epitropctl/system_sync_live_test.go'
      - 'cmd/epitropctl/testdata/live/**'
      - '.github/workflows/live-sync.yml'
      - '.github/actions/setup-go/**'
      - 'go.mod'
      - 'go.sum'
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
    branches: [main]
    paths:
      - 'catalog/**'
      - 'internal/atomicfile/**'
      - 'internal/sources/ollamalocal/**'
      - 'internal/sources/litellmgateway/**'
      - 'internal/sources/httpfetch/**'
      - 'cmd/epitropctl/sync.go'
      - 'cmd/epitropctl/cli_build_test.go'
      - 'cmd/epitropctl/system_sync_live_test.go'
      - 'cmd/epitropctl/testdata/live/**'
      - '.github/workflows/live-sync.yml'
      - '.github/actions/setup-go/**'
      - 'go.mod'
      - 'go.sum'

permissions:
  contents: read

jobs:
  live-sync:
    name: Ollama and LiteLLM live sync
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    env:
      OLLAMA_IMAGE: docker.io/ollama/ollama:0.40.17@sha256:ccc42bcd3d5fcf7ab0d532b300382154e1a4da56fc666bdb313b78ebdd912754
      LITELLM_IMAGE: ghcr.io/berriai/litellm:v1.109.1@sha256:11175975a3093e05e92faee2fe2fe3412a3ae2fcaa849eb0fe25d5f0d8bcb2e9
      LIVE_NETWORK: epitrop-live-sync
      OLLAMA_CONTAINER: epitrop-live-ollama
      LITELLM_CONTAINER: epitrop-live-litellm
      OLLAMA_MODEL: all-minilm:22m
      LITELLM_MODEL: live/all-minilm
    steps:
      - name: Stop on a draft pull request
        if: github.event.pull_request.draft == true
        shell: bash
        env:
          TITLE: Gate not run on a draft
          MESSAGE: >-
            The gate did not run because the pull request is a draft.
            It runs when the pull request is marked ready for review.
        run: |
          echo "::error title=$TITLE::$MESSAGE"
          echo "$MESSAGE" >> "$GITHUB_STEP_SUMMARY"
          exit 1
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        if: github.event.pull_request.draft != true
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-go
        if: github.event.pull_request.draft != true

      - name: Start Ollama and pull minimal model
        run: |
          set -euo pipefail
          docker network create "$LIVE_NETWORK"
          docker run -d \
            --name "$OLLAMA_CONTAINER" \
            --network "$LIVE_NETWORK" \
            -p 127.0.0.1:11434:11434 \
            "$OLLAMA_IMAGE"
          ready=0
          for _ in $(seq 1 30); do
            if curl -fsS --max-time 2 http://127.0.0.1:11434/api/version >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::Ollama did not become ready within 30 attempts"
            exit 1
          fi
          if ! timeout --preserve-status 180s docker exec "$OLLAMA_CONTAINER" ollama pull "$OLLAMA_MODEL"; then
            echo "::error::Ollama model pull timed out or failed for $OLLAMA_MODEL"
            exit 1
          fi

      - name: Start LiteLLM proxy
        run: |
          set -euo pipefail
          TOKEN_FILE="$RUNNER_TEMP/litellm-master-key"
          umask 077
          # The key is random per run, only the LiteLLM container on 127.0.0.1 accepts it, cleanup
          # removes that container, and no step prints it (the positive row fails when sync prints it).
          LITELLM_MASTER_KEY="sk-$(openssl rand -hex 32)"
          printf '%s\n' "$LITELLM_MASTER_KEY" > "$TOKEN_FILE"
          chmod 0600 "$TOKEN_FILE"
          export LITELLM_MASTER_KEY
          docker run -d \
            --name "$LITELLM_CONTAINER" \
            --network "$LIVE_NETWORK" \
            -p 127.0.0.1:4000:4000 \
            -e LITELLM_MASTER_KEY \
            -v "$GITHUB_WORKSPACE/cmd/epitropctl/testdata/live/litellm-config.yaml:/etc/litellm/config.yaml:ro" \
            "$LITELLM_IMAGE" \
            --config /etc/litellm/config.yaml --port 4000
          ready=0
          for _ in $(seq 1 60); do
            if curl -fsS --max-time 2 http://127.0.0.1:4000/health/readiness >/dev/null 2>&1; then
              ready=1
              break
            fi
            sleep 1
          done
          if [ "$ready" -ne 1 ]; then
            echo "::error::LiteLLM proxy did not become ready within 60 attempts"
            exit 1
          fi

      - name: Run live catalog sync test
        env:
          EPITROP_LIVE_OLLAMA: http://127.0.0.1:11434
          EPITROP_LIVE_OLLAMA_MODEL: ${{ env.OLLAMA_MODEL }}
          EPITROP_LIVE_LITELLM_BASE: http://127.0.0.1:4000
          EPITROP_LIVE_LITELLM_MODEL: ${{ env.LITELLM_MODEL }}
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/live-sync-test.log"
          EPITROP_LIVE_LITELLM_TOKEN_FILE="$RUNNER_TEMP/litellm-master-key" \
            go test -count=1 -run '^TestSystemSyncLive' -v ./cmd/epitropctl/ 2>&1 | tee "$OUT"
          if grep -q -- "--- SKIP" "$OUT"; then
            echo "::error::TestSystemSyncLive was skipped; expected to run against live servers" >&2
            exit 1
          fi
          if ! grep -q -- "--- PASS: TestSystemSyncLive" "$OUT"; then
            echo "::error::TestSystemSyncLive did not pass" >&2
            exit 1
          fi

      - name: Print container logs on failure
        if: failure() && github.event.pull_request.draft != true
        run: |
          for c in "$OLLAMA_CONTAINER" "$LITELLM_CONTAINER"; do
            if docker container inspect "$c" >/dev/null 2>&1; then
              echo "=== $c (last 100 lines) ==="
              if ! docker logs --tail 100 "$c"; then
                echo "::warning::could not read the logs of $c"
              fi
            fi
          done

      - name: Cleanup containers and network
        if: always() && github.event.pull_request.draft != true
        run: |
          status=0
          for c in "$LITELLM_CONTAINER" "$OLLAMA_CONTAINER"; do
            if docker container inspect "$c" >/dev/null 2>&1; then
              if ! docker rm -f "$c"; then
                echo "::error::could not remove container $c"
                status=1
              fi
            fi
          done
          if docker network inspect "$LIVE_NETWORK" >/dev/null 2>&1; then
            if ! docker network rm "$LIVE_NETWORK"; then
              echo "::error::could not remove network $LIVE_NETWORK"
              status=1
            fi
          fi
          if ! rm -f "$RUNNER_TEMP/litellm-master-key"; then
            echo "::error::could not remove token file $RUNNER_TEMP/litellm-master-key"
            status=1
          fi
          exit "$status"
