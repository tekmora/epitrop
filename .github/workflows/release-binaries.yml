name: Release Binaries

on:
  workflow_call:

permissions:
  contents: read

jobs:
  release:
    name: Build, Sign, Attest And Publish
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6  # v4.1.2
        with:
          cosign-release: v3.1.4

      - name: Setup Go Toolchain
        uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - name: Check GoReleaser Configuration
        uses: ./.github/actions/release-check

      # The notes of a release are the tag's section of CHANGELOG.md, the text
      # that was reviewed and merged. Without that section the run stops here,
      # before anything is built. The file lies outside the checkout, which
      # GoReleaser requires to be unchanged.
      - name: Take The Release Notes From The Changelog
        env:
          TAG: ${{ github.ref_name }}
        run: go run ./tools/releasenotes -changelog=CHANGELOG.md -version="$TAG" -out="$RUNNER_TEMP/release-notes.md"

      - name: Build Archives, SBOMs And Signed Checksums Into A Draft Release
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --clean --release-notes=${{ runner.temp }}/release-notes.md
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify The Checksums Bundle Against This Workflow
        env:
          SIGNER: ${{ github.server_url }}/${{ github.repository }}/.github/workflows/release-binaries.yml@${{ github.ref }}
        run: |
          cosign verify-blob \
            --certificate-identity "$SIGNER" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --bundle dist/checksums.txt.sigstore.json \
            dist/checksums.txt

      - name: Attest Every Checksummed Artefact
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8  # v4.2.2
        with:
          subject-checksums: dist/checksums.txt

      - name: Publish The Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
        run: gh release edit "$TAG" --draft=false
