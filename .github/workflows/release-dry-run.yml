name: Release dry run

# Builds what a release tag would build, without signing and without
# publishing: the GoReleaser configuration check, then a snapshot of every
# archive and SBOM. The release workflow runs only on a tag, so without this a
# broken release build shows first on the day of a release. It runs only when
# something that goes into the archives, or steers how they are built,
# changes. Because the trigger is path-filtered, it is not a required check.
on:
  push:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yaml'
      - 'README.md'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'NOTICE.md'
      - 'catalog/snapshot.schema.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release*.yml'
      - '.github/actions/setup-go/**'
      - '.github/actions/release-check/**'
  pull_request:
    branches: [main]
    paths:
      - '**.go'
      - 'go.mod'
      - 'go.sum'
      - '.goreleaser.yaml'
      - 'README.md'
      - 'LICENSE'
      - 'LICENSES/**'
      - 'NOTICE.md'
      - 'catalog/snapshot.schema.json'
      - 'CHANGELOG.md'
      - '.github/workflows/release*.yml'
      - '.github/actions/setup-go/**'
      - '.github/actions/release-check/**'

permissions:
  contents: read

jobs:
  snapshot:
    name: Check The Configuration And Build A Snapshot
    runs-on: ubuntu-26.04
    timeout-minutes: 20
    steps:
      # The Go setup and the release check come from the same local actions
      # release-binaries.yml uses: a dry run with other tools proves nothing
      # about the release.
      - name: Checkout Source Code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Setup Go Toolchain
        uses: ./.github/actions/setup-go
        with:
          cache: 'false'

      - name: Check GoReleaser Configuration
        uses: ./.github/actions/release-check

      # A snapshot builds no release notes, so the command the release
      # workflow runs for them runs here on the newest released section of the
      # changelog. No heading found leaves the version empty, which the tool
      # refuses.
      - name: Take The Release Notes Of The Newest Released Version
        run: |
          set -euo pipefail
          version=$(sed -n '/^## \[[0-9]/{s/^## \[\([^]]*\)\].*/\1/p;q}' CHANGELOG.md)
          echo "version=$version"
          go run ./tools/releasenotes -changelog=CHANGELOG.md -version="v$version" -out="$RUNNER_TEMP/release-notes.md"
          wc -l "$RUNNER_TEMP/release-notes.md"

      # --snapshot publishes nothing and needs no tag; --skip=sign leaves out
      # the keyless signature, which needs the release workflow's identity.
      - name: Build Archives And SBOMs As A Snapshot
        uses: goreleaser/goreleaser-action@a4f02ab5355a589de60d917a659ce617ed19b3de  # v7.3.0
        with:
          distribution: goreleaser
          version: v2.19.0
          args: release --snapshot --clean --skip=sign

      # A tag with a prerelease suffix (v0.1.0-rc.1) must publish as a
      # prerelease, which GitHub never marks as the latest release. GoReleaser
      # does that only with release.prerelease set to auto; the default, false,
      # publishes the rc as the latest release. dist/config.yaml is the
      # configuration GoReleaser ran with, defaults filled in.
      - name: Check A Prerelease Tag Publishes As A Prerelease
        run: |
          set -euo pipefail
          got=$(yq '.release.prerelease' dist/config.yaml)
          echo "release.prerelease=$got"
          if [ "$got" != "auto" ]; then
            echo "::error::release.prerelease is '$got', want 'auto': an rc tag would publish as the latest release"
            exit 1
          fi

      # Six targets (linux, darwin and windows on amd64 and arm64) give six
      # archives and six SBOMs. A target dropped from the configuration still
      # builds without an error, so the count is checked here. checksums.txt
      # must list those twelve files and the snapshot schema, and nothing
      # else: the signature and the provenance of a release cover exactly the
      # files it lists. GoReleaser reads the schema from catalog/, so it is
      # copied under its published name for the digest check.
      - name: Check The Snapshot Holds What A Release Publishes
        run: |
          set -euo pipefail
          archives=$(find dist -maxdepth 1 -type f \( -name '*.tar.gz' -o -name '*.zip' \) | wc -l)
          sboms=$(find dist -maxdepth 1 -type f -name '*.cyclonedx.json' | wc -l)
          echo "archives=$archives sboms=$sboms"
          if [ "$archives" -ne 6 ] || [ "$sboms" -ne 6 ]; then
            echo "::error::expected 6 archives and 6 SBOMs, found $archives and $sboms"
            ls -l dist
            exit 1
          fi
          listed=$(wc -l < dist/checksums.txt)
          schema=$(awk '$2 == "snapshot.schema.json"' dist/checksums.txt | wc -l)
          echo "listed=$listed schema=$schema"
          if [ "$listed" -ne 13 ] || [ "$schema" -ne 1 ]; then
            echo "::error::checksums.txt must list 13 files, one of them snapshot.schema.json; it lists $listed, the schema $schema times"
            cat dist/checksums.txt
            exit 1
          fi
          cp catalog/snapshot.schema.json dist/snapshot.schema.json
          (cd dist && sha256sum --check --strict checksums.txt)
          binary=$(find dist -type f -perm -u+x -path '*_linux_amd64*' | head -n 1)
          if [ -z "$binary" ]; then
            echo "::error::no linux/amd64 binary under dist"
            exit 1
          fi
          stamped=$("$binary" version)
          echo "version=$stamped"
          case "$stamped" in
            *-snapshot) ;;
            *)
              echo "::error::the binary reports version '$stamped', want one ending in -snapshot"
              exit 1
              ;;
          esac
