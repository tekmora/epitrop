name: Upstream schemas

# Fetches the pinned upstream documents and checks that the committed schema
# fragments still match what they give. The path-filtered push and pull
# request triggers run it when the pins, the fragments or their extractor
# change. The upstream publisher can also change a live document at any time,
# so a weekly run on main shows that drift as its own red run instead of as a
# surprise on an unrelated pull request. Because of the path filter this is
# not a required check, so an upstream outage cannot block unrelated merges.
# After drift, run `make schemas-repin` by hand and review the diff. A
# hand-edited fragment is still refused on every pull request by the digest
# test in go test.
on:
  push:
    branches: [main]
    paths:
      - 'internal/sources/upstream-schemas.json'
      - 'internal/sources/*/testdata/upstream/**'
      - 'tools/schemas/**'
      - 'Makefile'
      - '.github/workflows/schemas.yml'
  pull_request:
    branches: [main]
    paths:
      - 'internal/sources/upstream-schemas.json'
      - 'internal/sources/*/testdata/upstream/**'
      - 'tools/schemas/**'
      - 'Makefile'
      - '.github/workflows/schemas.yml'
  schedule:
    - cron: '47 6 * * 3'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schemas:
    runs-on: ubuntu-26.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@d8cbb8045d7f43706b9177cceb36c1f91a6644d5  # v7.1.0
        with:
          go-version-file: 'go.mod'
      - name: Upstream schema fragments match their pinned documents
        run: make schemas-check
