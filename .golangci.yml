---
version: "2"
run:
  timeout: 10m
linters:
  default: none
  enable:
    - govet
    - staticcheck
    - errcheck
    - errorlint
    - nilerr
    - unused
    - ineffassign
    - bodyclose
    - noctx
    - gocyclo
    - gocognit
  settings:
    gocyclo:
      min-complexity: 10
    gocognit:
      min-complexity: 15
    errcheck:
      check-type-assertions: true
      check-blank: true
  exclusions:
    # One rule per file and linter for the HISS-04 caps; each is a dated exception that
    # the engine audit checks: a rule without its comment, or past its date, fails.
    rules: []
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
  uniq-by-line: false
