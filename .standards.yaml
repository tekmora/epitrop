---
version: 1
repository:
  owner: tekmora
  name: epitrop
  visibility: public
  description: ""
  homepage: ""
  topics: []
# Agent clients and editors in use. The engine compiles, generates and verifies files for
# these ids only; files of every other id are not tracked here.
agent_clients: [claude, codex, gemini]
editors: [universal, vscode, antigravity]
profiles:
  - framework
facets:
  - security:high
  - api:public-contract
  - docs:seo-portal
  - agent:sandboxed
register:
  sources:
    expected: 13
    sha256:
      sha256:cd68bbc872f295d200abf1f89d007a503368df2b0b67847e24921b02262e3744
    inputs:
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: operating_contract.*
      - path: .paperclip/harness.json
        surface: prompts
        kind: message
        format: json
        selector: invariants.*
# Overrides only raise strictness, except the explicit review mode below, which
# permits single-maintainer operation as in cordanaLLM/praetor. Restore independent
# review when a second maintainer or a review bot can approve; the required count
# stays so that restoration keeps the minimum.
overrides:
  branch_protection:
    enforce_linear_history: true
    require_signed_commits: true
    required_approving_reviewers: 1
    review_mode: single_maintainer
    dismiss_stale_reviews: true
    # Declared at its live value; the forge default is the stricter one.
    require_extra_approval_for_unattributed_changes: true
# Documentation drift (praetorctl docs references): a change to a surface must carry a change to
# one of its documents, or a Docs-Waiver with a reason.
docs_surfaces:
  - name: "epitropctl CLI"
    paths:
      - "cmd/epitropctl/*.go"
    exclude:
      - "cmd/epitropctl/*_test.go"
    docs:
      - "README.md"
      - "docs/agent-onboarding.md"
      - "docs/data-sync.md"
  - name: "epitrop-server MCP tools"
    paths:
      - "cmd/epitrop-server/*.go"
      - "internal/mcp/*.go"
    exclude:
      - "cmd/epitrop-server/*_test.go"
      - "internal/mcp/*_test.go"
    docs:
      - "README.md"
      - "docs/agent-onboarding.md"
  - name: "model catalog and sources"
    paths:
      - "catalog/*.go"
      - "internal/sources/**/*.go"
    exclude:
      - "catalog/*_test.go"
      - "internal/sources/**/*_test.go"
    docs:
      - "docs/agent-onboarding.md"
      - "docs/architecture-v2.md"
      - "docs/data-sync.md"
