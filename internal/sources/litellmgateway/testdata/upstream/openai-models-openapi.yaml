openapi: 3.1.0
info:
  title: OpenAI API
  description: The OpenAI REST API. Please see
    https://platform.openai.com/docs/api-reference for more details.
  version: 2.3.0
  termsOfService: https://openai.com/policies/terms-of-use
  contact:
    name: OpenAI Support
    url: https://help.openai.com/
  license:
    name: MIT
    identifier: MIT
servers:
  - url: https://api.openai.com/v1
tags:
  - name: Models
    description: List and describe the various models available in the API.
paths:
  /models:
    get:
      operationId: listModels
      tags:
        - Models
      summary: List models
      description: Lists the currently available models, and provides basic
        information about each one such as the owner and availability.
      responses:
        "200":
          description: OK
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ListModelsResponse"
        "403":
          description: The API credential does not have permission to list models.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PermissionErrorResponse"
components:
  schemas:
    ListModelsResponse:
      type: object
      properties:
        object:
          type: string
          enum:
            - list
          x-stainless-const: true
        data:
          type: array
          items:
            $ref: "#/components/schemas/Model"
      required:
        - object
        - data
    Model:
      title: Model
      description: Describes an OpenAI model offering that can be used with the API.
      properties:
        id:
          type: string
          description: The model identifier, which can be referenced in the API endpoints.
        created:
          type: integer
          format: unixtime
          description: The Unix timestamp (in seconds) when the model was created.
        object:
          type: string
          description: The object type, which is always "model".
          enum:
            - model
          x-stainless-const: true
        owned_by:
          type: string
          description: The organization that owns the model.
        shutdown_date:
          anyOf:
            - type: string
              format: date
            - type: "null"
          description: The date when the model will shut down, or null if not announced.
      required:
        - id
        - object
        - created
        - owned_by
    PermissionErrorResponse:
      type: object
      properties:
        error:
          description: Details about the permission error.
          anyOf:
            - $ref: "#/components/schemas/Error"
            - type: string
              description: An explanation of the missing API permissions.
      required:
        - error
    Error:
      type: object
      properties:
        code:
          anyOf:
            - type: string
            - type: "null"
        message:
          type: string
        param:
          anyOf:
            - type: string
            - type: "null"
        type:
          type: string
        misalignment:
          $ref: "#/components/schemas/MisalignmentErrorDetailsResource"
      required:
        - type
        - message
        - param
        - code
    MisalignmentErrorDetailsResource:
      properties:
        review_target:
          anyOf:
            - not:
                pattern: "[^A-Za-z0-9._~:-]"
              type: string
              maxLength: 96
              minLength: 1
              pattern: ^[A-Za-z0-9._~:-]+$
              description: An opaque target for explicitly continuing this review, or null
                when unavailable.
            - type: "null"
        error_type:
          $ref: "#/components/schemas/_MisalignmentErrorType"
          description: An optional classification; clients must accept additional values.
        detailed_explanation:
          type: string
          description: The public explanation for this block.
        steer:
          $ref: "#/components/schemas/_MisalignmentSteer"
          description: An optional public continuation instruction.
      type: object
      required: []
    _MisalignmentErrorType:
      anyOf:
        - type: string
        - type: string
          enum:
            - potentially_unintended_data_transfer
            - potentially_unintended_data_access
            - potentially_unintended_destructive_activity
            - other
    _MisalignmentSteer:
      properties:
        message:
          type: string
          description: The public continuation instruction.
      type: object
      required:
        - message
